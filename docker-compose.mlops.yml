# Optional Local MLOps Stack (MLflow + MinIO)
# Usage: docker compose -f docker-compose.mlops.yml up -d
# Note: LOCAL ONLY. Not part of the free cloud hosted deployment.

version: "3.8"

services:
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: forecastly-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: forecastly-mlflow
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: miniopassword
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
    depends_on:
      - minio
    volumes:
      - mlflow_data:/mlflow

volumes:
  minio_data:
  mlflow_data:
