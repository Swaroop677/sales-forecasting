services:
  - type: web
    name: forecastly
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: MAX_UPLOAD_ROWS
        value: "200000"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
